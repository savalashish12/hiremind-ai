<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Icon: Neural Node Network -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <circle cx="16" cy="16" r="4" fill="url(#logo-grad)" />
    <circle cx="8" cy="28" r="3" fill="#3b82f6" />
    <circle cx="24" cy="28" r="3" fill="#8b5cf6" />
    <circle cx="16" cy="36" r="3" fill="url(#logo-grad)" />
    <line x1="16" y1="16" x2="8" y2="28" stroke="#3b82f6" stroke-width="1.5" opacity="0.8" />
    <line x1="16" y1="16" x2="24" y2="28" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8" />
    <line x1="8" y1="28" x2="16" y2="36" stroke="url(#logo-grad)" stroke-width="1.5" opacity="0.8" />
    <line x1="24" y1="28" x2="16" y2="36" stroke="url(#logo-grad)" stroke-width="1.5" opacity="0.8" />
    <circle cx="16" cy="26" r="2" fill="#fff" opacity="0.9" />
  </g>
  <!-- Text -->
  <text x="50" y="32" fill="#fff" font-family="'Inter', sans-serif" font-weight="900" font-size="16" letter-spacing="1">HireMind <tspan fill="url(#logo-grad)">AI</tspan></text>
</svg>
